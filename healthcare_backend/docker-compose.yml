services:
  db:
    image: postgres:16-alpine
    container_name: healthcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-healthcare_db}
      POSTGRES_USER: ${DB_USER:-healthcare_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-healthcare_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-healthcare_user} -d ${DB_NAME:-healthcare_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
